version: '3.8'

services:
  web:
    image: nginx:stable-alpine-otel
    ports:
      - "80:80"
    volumes:
      - type: bind
        source: ./index.html
        target: /usr/share/nginx/html/index.html
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
