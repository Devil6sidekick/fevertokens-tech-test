name: Deploy Docker Stack

on:
  push:
    paths:
      - 'index.html'
      - 'docker-compose.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Generate SSH key
        run: ssh-keygen -t ed25519 -P "" -f ~/.ssh/id_ed25519

      - name: Add SSH key to agent
        run: |
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519

      - name: Copy public key to Docker Swarm manager node
        run: |
          ssh -o StrictHostKeyChecking=no ip172-18-0-123-cpjljna91nsg00fkkjng@direct.labs.play-with-docker.com "mkdir -p ~/.ssh && echo $(cat ~/.ssh/id_ed25519.pub) >> ~/.ssh/authorized_keys"

      - name: Deploy application stack to Docker Swarm
        run: |
          scp -o StrictHostKeyChecking=no docker-compose.yml ip172-18-0-123-cpjljna91nsg00fkkjng@direct.labs.play-with-docker.com:~/
          ssh -o StrictHostKeyChecking=no ip172-18-0-123-cpjljna91nsg00fkkjng@direct.labs.play-with-docker.com "docker stack deploy --compose-file ~/docker-compose.yml fevertokens"
