name: Deploy Docker Stack

on:
  push:
    paths:
      - 'index.html'
      - 'docker-compose.yml'

jobs:
  transfer-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client
      - name: Set up SSH key
        run: ssh-keygen -t ed25519 -P "" -f ~/.ssh/id_ed25519
          

      - name: Add files to Docker Swarm
        run: |
          sftp -o StrictHostKeyChecking=no  ip172-18-0-112-cpk8d6qim2rg00dmipgg@direct.labs.play-with-docker.com <<EOF
          put docker-compose.yml /root/
          put index.html /root/
          put script /root/
          EOF

  deploy:
    runs-on: ubuntu-latest
    needs: transfer-files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client
      - name: Set up SSH key
        run: ssh-keygen -t ed25519 -P "" -f ~/.ssh/id_ed25519
          
      - name: Execute Remote SSH Command
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            chmod +x script
            ./script
          command_timeout: 10m
