name: Deploy Docker Stack

on:
  push:
    paths:
      - 'index.html'
      - 'docker-compose.yml' # Trigger workflow on changes to index.html or docker-compose.yml

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Generate SSH key
        run: ssh-keygen -t ed25519 -P "" -f ~/.ssh/id_ed25519

      - name: Copy public key to Docker Swarm manager node
        run: scp -o StrictHostKeyChecking=no ~/.ssh/id_ed25519.pub ${{ secrets.MANAGER_IP }}:~/id_ed25519.pub

      - name: Deploy application stack to Docker Swarm
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.MANAGER_IP }} "docker stack deploy --compose-file docker-compose.yml fevertokens"
