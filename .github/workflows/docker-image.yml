name: Deploy Docker Stack

on:
  push:
    paths:
      - 'index.html'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          ssh-keygen -t ed25519 -P "" -f $HOME/.ssh/id_ed25519
          eval "$(ssh-agent -s)"
          ssh-add $HOME/.ssh/id_ed25519

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Copy SSH public key to manager node
        run: |
          sftp -o StrictHostKeyChecking=no ip172-18-0-110-cpjp5bol2o9000f0imsg@direct.labs.play-with-docker.com <<EOF
          put $HOME/.ssh/id_ed25519.pub /root/.ssh/authorized_keys
          EOF
          ssh -o StrictHostKeyChecking=no ip172-18-0-110-cpjp5bol2o9000f0imsg@direct.labs.play-with-docker.com "
          docker stack deploy --compose-file ~/docker-compose.yml fevertokens
          "

