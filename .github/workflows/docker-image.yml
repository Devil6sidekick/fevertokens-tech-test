
name: Deploy Docker Stack

on:
  push:
    paths:
      - 'index.html'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client
      - name: Set up SSH key
        run: ssh-keygen -t ed25519 -P "" -f ~/.ssh/id_ed25519
          

      - name: Add files to Docker Swarm
        run: |
          sftp -o StrictHostKeyChecking=no ip172-18-0-135-cpk33fq91nsg00eubg60@direct.labs.play-with-docker.com <<EOF
          put docker-compose.yml /root/
          put index.html /root/
          EOF
      - name: Deploy application to Docker Swarm
        run: ssh -o ServerAliveCountMax=30 ip172-18-0-135-cpk33fq91nsg00eubg60@direct.labs.play-with-docker.com "ls"